<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="30" />
  <title>Maintenance — WorkForce Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 2rem; text-align: center; max-width: 400px; width: calc(100% - 2rem); }
    .icon { font-size: 2rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; color: #111827; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.875rem; line-height: 1.5; margin-bottom: 0.5rem; }
    button { margin-top: 1rem; background: #1d4ed8; color: white; border: none; border-radius: 6px; padding: 0.5rem 1.25rem; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
    button:hover { background: #1e40af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>Scheduled Maintenance</h1>
    <p>WorkForce Pro is temporarily unavailable for maintenance.</p>
    <p>Please check back shortly.</p>
    <button onclick="location.reload()">↺ Refresh Page</button>
  </div>
</body>
</html>
